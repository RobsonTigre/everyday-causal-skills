[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "everyday-causal-skills-evals"
# Versions the eval framework, NOT the plugin. The plugin's version lives in the six
# manifests (currently 0.6.0) and is enforced by evals/test_manifests.py. These two
# numbers are independent by design — do not "sync" them.
version = "0.3.2"
description = "Eval framework for everyday-causal-skills plugin"
# The eval ENVIRONMENT needs 3.10+ (pycausalarima), enforced by sweep._MIN_EVAL_PYTHON.
# This is not the plugin's own floor: skills/*/SKILL.md compatibility describes what a
# plugin user needs to run the templates, which is a different environment.
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
parity = [
    # Python packages the parity reference recipes import (evals/parity/reference/*.py).
    # Kept in sync with each spec's `requires.python` by evals/parity/test_parity_deps.py.
    # Pins on the numerically-sensitive RDD/SC packages reflect the versions verified green.
    "rdrobust>=2.0.0",
    "rddensity>=2.4.6",
    "scpi-pkg>=3.0.1",
    "diff-diff",
    "econml",
    "linearmodels",
    "statsmodels",
    "networkx",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
]
evals = [
    # Everything the eval harness executes: the parity recipes, plus the full
    # Python dependency set the shipped templates import. Anchored on the book's
    # requirements.txt (Desktop/everyday-ci/requirements.txt) because the templates
    # ship code the book runs — the two must not drift.
    "everyday-causal-skills-evals[parity]",
    "pandas<3",         # pycausalimpact uses pandas APIs removed in 3.x
    "scipy",
    "scikit-learn",
    "mcf",
    # Imports as `causalimpact`. NOT the unrelated `causalimpact` distribution,
    # which has a different API and inverted effect-bound labels.
    "pycausalimpact",
    "pycausalarima; python_version >= '3.10'",
    # Repo-only, absent from the book's list:
    "dowhy",            # evals/cases/layer3/dag_dowhy_python.yaml
]

[tool.setuptools]
# This project is a dependency manifest for the eval/parity harness, not an
# importable library. Install zero modules so `pip install -e ".[parity]"`
# resolves the deps without setuptools flat-layout auto-discovery choking on
# the repo's many top-level dirs (assets/, docs/, skills/, …).
py-modules = []
