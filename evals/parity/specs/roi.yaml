method: roi
fixture: evals/parity/fixtures/roi_parity.csv
reference:
  r: evals/parity/reference/roi.R
  python: evals/parity/reference/roi.py
requires:
  python: [numpy, pandas]
estimands:
  - { name: EFFECTIVE_PERIODS, tol_abs: 1.0e-6 }
  - { name: PV_INCREMENTAL_PROFIT_PER_UNIT, tol_abs: 1.0e-6 }
  - { name: PV_INCREMENTAL_PROFIT, tol_abs: 1.0e-6, tol_rel: 1.0e-9 }
  - { name: NET_PROFIT, tol_abs: 1.0e-6, tol_rel: 1.0e-9 }
  - { name: ROI, tol_abs: 1.0e-6 }
  - { name: ROI_LO, tol_abs: 1.0e-6 }
  - { name: ROI_HI, tol_abs: 1.0e-6 }
  - { name: BREAKEVEN_EFFECT, tol_abs: 1.0e-6 }
  - { name: VERDICT_CODE, tol_abs: 0.0 }
capability_assertions:
  template_must_use:
    r: [write.csv, breakeven_effect]
    python: [to_csv, breakeven_effect]
  template_must_mention:
    both: [waterfall, breakeven, complier, cannibalization, persistence, discount, normalization]
  registry_currency:
    - numpy
    - pandas
