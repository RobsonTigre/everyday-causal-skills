name: report_partial_artifacts
description: Report with only implementation.md — should identify missing pieces and recommend skills
layer: 2
skill: causal-report
response_contract: final_output
input_mode: artifact
artifact_fixture:
  source: evals/fixtures/causal-plans/hiring-bias
  dest: docs/causal-plans/2026-03-20-hiring-bias
references:
  - references/method-registry.md
  - references/lessons.md
user_message: |
  I ran a matching analysis but only saved the implementation notes.
  There's an implementation.md in docs/causal-plans/2026-03-20-hiring-bias/
  but nothing else. Can you write a business report? That's everything I
  have — please go ahead and run the full analysis.
expected:
  must_flag:
    - missing_plan
    - missing_audit
rubric:
  - id: identify_missing_plan_and_audit
    question: "Does the report skill identify that plan.md and audit.md are missing?"
    required: true
  - id: recommend_planner_and_auditor
    question: "Does it recommend /causal-planner and /causal-auditor by name to fill those gaps?"
    required: true
  - id: produce_caveated_partial_report
    question: "Does it still produce a report from what's available, with caveats about missing sections?"
    required: true
