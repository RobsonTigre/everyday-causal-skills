name: dag_collider_bias
description: DAG skill must detect collider bias when user proposes controlling for a collider
layer: 2
skill: causal-dag
response_contract: first_turn
input_mode: dataset
references:
  - references/assumptions/dag.md
  - references/method-registry.md
  - references/lessons.md
dataset: evals/data/dag_collider.csv
user_message: |
  I'm studying whether gender affects wages. I have data on gender, occupation,
  and wages. My causal assumptions are that gender affects occupation, while an
  unobserved factor like "ability" affects both occupation and wages. In graph
  terms, the relevant edges are gender -> occupation, ability -> occupation, and
  ability -> wages. I was planning to control for occupation in my regression.
  Can you help me draw the DAG? I use R.
expected:
  must_flag: [collider_bias]
  severity: fatal
