name: roi_full_artifacts
description: ROI with a complete DiD artifact set — normalization gate, per-period summing, waterfall, pipeline breakeven, range, six assumptions
layer: 2
skill: causal-roi
input_mode: inline
references:
  - references/roi-framework.md
  - references/method-registry.md
  - references/lessons.md
user_message: |
  Here's the full chain from my analysis — treat the following as the complete
  input. implementation.md: staggered DiD
  (Callaway-Sant'Anna), ATT per-period event-study estimates that average to
  R$1,200 incremental profit per store per month over the post window (a monthly
  rate, not a cumulative total), 95% CI [800, 1600], 400 treated stores.
  audit.md: no fatal findings, one serious note about a short pre-period.
  Finance says: build cost R$900k one-time plus R$20k/month maintenance,
  12-month horizon, monthly discount rate 0.8%, persistence 1.0 (my call — the
  holdout shows the effect stable so far), no store churn, full rollout at
  launch to the same 400 stores, no expansion, cannibalization assessed as
  negligible (net incrementality 1.0). Hurdle is breakeven, confirmed, with a
  2x margin-of-safety buffer. Use R. Everything is final — don't wait for my
  confirmation, translate this into ROI and a recommendation now.
expected:
  must_flag:
    - audit_carryover
  rubric:
    - id: normalization_gate
      question: "Does the response record a normalization gate — outcome construct (profit), unit denominator (per store), and effect period (per month) — before computing money?"
      required: true
    - id: per_period_not_cumulative
      question: "Does it treat the DiD event-study estimates as a per-period monthly rate (summed/discounted at most once) rather than re-summing an already-cumulative total?"
      required: true
    - id: projection_waterfall
      question: "Does it show a projection waterfall or an explicit factor-by-factor path from the naive projection to the final value?"
      required: true
    - id: same_pipeline_breakeven
      question: "Is breakeven derived from the same pipeline as ROI (investment divided by the same multiplier), not from a different shortcut formula?"
      required: true
    - id: interval_roi
      question: "Is ROI presented as a range or interval (using the CI bounds), not only a single point?"
      required: true
    - id: six_pipeline_assumptions
      question: "Does it list or reference the six translation-pipeline assumptions (valid upstream estimate, predictable decay, scaling without saturation, stable costs, no cannibalization, stable metric definitions)?"
      required: true
    - id: executable_r_calculation
      question: "Does it generate executable R code for the calculation rather than doing the arithmetic conversationally?"
      required: true
    - id: decision_rule_encoded_verdict_withheld
      question: "Does the generated R script encode the framework's full four-way decision matrix — CI upper bound below the hurdle line → kill; CI lower bound at least k times the line → full ship; CI lower bound at least the line → ship staged; otherwise → size the bet — and does the prose withhold the final numeric ROI, breakeven, and verdict pending actual execution?"
      required: true
