user_message: |
  My project folder docs/causal-plans/2026-06-01-checkout-redesign/ has the full
  chain — treat the following as its contents. implementation.md: staggered DiD
  (Callaway-Sant'Anna), ATT per-period event-study estimates that average to
  R$1,200 incremental profit per store per month over the post window (a monthly
  rate, not a cumulative total), 95% CI [800, 1600], 400 treated stores.
  audit.md: no fatal findings, one serious note about a short pre-period.
  Finance says: build cost R$900k one-time plus R$20k/month maintenance,
  12-month horizon, monthly discount rate 0.8%, persistence 1.0 (my call — the
  holdout shows the effect stable so far), no store churn, full rollout at
  launch to the same 400 stores, no expansion, cannibalization assessed as
  negligible (net incrementality 1.0). Hurdle is breakeven, confirmed, with a
  2x margin-of-safety buffer. Use R. Everything is final — don't wait for my
  confirmation, translate this into ROI and a recommendation now.
expected:
  must_flag:
    - audit_carryover
  rubric:
    - "Does the response record a normalization gate — outcome construct (profit), unit denominator (per store), and effect period (per month) — before computing money?"
    - "Does it treat the DiD event-study estimates as a per-period monthly rate (summed/discounted at most once) rather than re-summing an already-cumulative total?"
    - "Does it show a projection waterfall or an explicit factor-by-factor path from the naive projection to the final value?"
    - "Is breakeven derived from the same pipeline as ROI (investment divided by the same multiplier), not from a different shortcut formula?"
    - "Is ROI presented as a range or interval (using the CI bounds), not only a single point?"
    - "Does it list or reference the six translation-pipeline assumptions (valid upstream estimate, predictable decay, scaling without saturation, stable costs, no cannibalization, stable metric definitions)?"
    - "Does it generate executable R code for the calculation rather than doing the arithmetic conversationally?"
    - "Is the verdict consistent with the numbers (CI lower bound comfortably above the breakeven line implies ship)?"
