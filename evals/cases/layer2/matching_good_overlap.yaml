user_message: |
  I have observational data on 1000 individuals with treatment assigned based on
  covariates x1 and x2. I want to estimate the ATE using propensity score matching.
  The fitted propensity-score diagnostics show common support: controls span
  0.164 to 0.803 and treated units span 0.200 to 0.808; neither group has scores
  below 0.10 or above 0.90. Treat overlap as observed to be adequate in this
  fixture. Recommending routine balance and sensitivity checks is welcome and
  should not be described as a known blocking violation. I use Python.
