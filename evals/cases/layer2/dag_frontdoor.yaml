name: dag_frontdoor
description: DAG skill must identify front-door criterion opportunity when backdoor is blocked
layer: 2
skill: causal-dag
response_contract: final_output
input_mode: inline
references:
  - references/assumptions/dag.md
  - references/method-registry.md
  - references/lessons.md
user_message: |
  I want to know if ad exposure increases purchases. There's an unobserved factor
  (brand affinity) that drives both who sees ads and who buys. But ad exposure
  works entirely through website visits — ads make people visit the site, and
  visits lead to purchases. Brand affinity affects ad exposure and purchases
  directly but NOT website visits. Help me with the DAG. I use Python. That's
  everything I have — please go ahead and run the full analysis.
expected:
  must_flag: [no_backdoor_adjustment]
rubric:
  - id: no_observed_backdoor_set
    question: "Does it recognise that no valid backdoor adjustment set exists, because brand affinity is unobserved?"
    required: true
  - id: frontdoor_identification
    question: "Does it identify the front-door criterion as the way to identify the effect here?"
    required: true
  - id: complete_mediation_no_affinity_to_visits
    question: "Does it explain that website visits mediate the whole effect of ad exposure and are unaffected by brand affinity?"
    required: true
