name: did_nonparallel_trends
description: DiD dataset where parallel trends is violated — pre-trends diverge
layer: 2
skill: causal-did
references:
  - references/assumptions/did.md
  - references/method-registry.md
  - references/lessons.md
dataset: evals/data/did_nonparallel.csv
user_message: |
  I have panel data for 100 stores over 24 months. Half the stores got a new
  inventory system at month 12. I want to estimate the effect on sales using DiD.
  A store-clustered regression restricted to the pre-treatment period estimates
  that treated stores were already growing 0.776 sales units per month faster than
  controls (SE 0.036, p < 0.001), and the event-study leads show the same steady
  divergence. Treat this as an observed diagnostic, not a pattern you need to infer
  from the five-row preview. I use R.
expected:
  must_flag: [parallel_trends]
  severity: fatal
