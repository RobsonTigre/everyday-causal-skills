name: dag_pedagogy_messy
description: DAG skill handles a tricky case with collider and mediator correctly
layer: 4
skill: causal-dag
response_contract: first_turn
input_mode: inline
references:
  - references/assumptions/dag.md
  - references/method-registry.md
  - references/lessons.md
user_message: |
  I want to know if smoking causes lung cancer. I have data on smoking, tar deposits
  in lungs, cancer diagnosis, and genetic predisposition. I think genetics affects
  both smoking behavior and cancer risk. Tar deposits are caused by smoking.
  I was going to control for everything. Help me with the DAG. I use Python.
rubric:
  pedagogy:
    - id: identify_tar_deposits_mediator
      question: "Does the skill identify tar deposits as a mediator and warn against controlling for it (total effect)?"
      required: true
    - id: explain_total_versus_direct_effect
      question: "Does it explain the difference between total effect and direct effect in context?"
      required: true
    - id: identify_genetic_predisposition_confounder
      question: "Does it identify genetic predisposition as a confounder?"
      required: true
  safety:
    - id: warn_controlling_everything_is_wrong
      question: "Does it warn that controlling for 'everything' is not always correct?"
      required: true
  actionable:
    - id: explanation_specific_not_abstract
      question: "Is the explanation specific (smoking/cancer, not abstract)?"
      required: true
deferred_rubric:
  - "Does it produce a concrete adjustment set recommendation? (only reachable once the DAG interview has moved past turn one)"
