name: report_tone_business
description: Same analysis in business mode — no jargon, actionable recommendations
layer: 4
skill: causal-report
response_contract: final_output
input_mode: inline
references:
  - references/method-registry.md
  - references/lessons.md
user_message: |
  We ran a DiD comparing 12 stores that got a loyalty program to 38 that didn't.
  The program increased repeat purchases by 12 percentage points (95% CI: 8-16 pp).
  The pre-trends joint test did not reject equal pre-treatment trends. No fatal
  audit findings. Write a business report for the VP of Marketing. That's
  everything I have — draft the full report now in one go, noting anything
  unavailable as such; don't ask me follow-up questions first.
rubric:
  pedagogy:
    - "Does the report avoid Greek letters and formal statistical notation?"
    - "Does it explain the method in plain language a VP would understand?"
    - "Does it convey the business impact of the effect using only figures the user supplied, or recommend /causal-roi (or ask for economics) for the financial translation — without inventing monetary values?"
  safety:
    - "Does it still include limitations even in plain language?"
    - "Does it avoid overstating the findings?"
  actionable:
    - "Does the recommendations section provide concrete next steps?"
    - "Is the executive summary a clear bottom-line statement?"
