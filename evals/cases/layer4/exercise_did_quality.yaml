name: exercise_did_quality
description: Exercise skill generates a DiD practice scenario — must be realistic and pedagogical
layer: 4
skill: causal-exercises
response_contract: final_output
references:
  - references/dgp-library.md
  - references/method-registry.md
  - references/lessons.md
user_message: |
  I'm a data scientist learning causal inference. Can you create a
  difference-in-differences practice exercise for me? I work in Python and
  want a scenario I might encounter in a real business setting. Make it
  Intermediate difficulty. Generate the complete exercise now, including runnable
  data-generation code and the requested deliverable; do not stop to ask me to
  choose more parameters.
rubric:
  pedagogy:
    - id: scenario_describe_realistic_business
      question: "Does the scenario describe a realistic business situation (not a textbook example with artificial setup)?"
      required: true
    - id: explain_student_look_without
      question: "Does the exercise explain what the student should look for (parallel trends, treatment effect) without giving the answer?"
      required: true
    - id: hints_progressive_guiding_students
      question: "Are the hints progressive — guiding the student's thinking rather than revealing the solution?"
      required: true
  safety:
    - id: include_realistic_complication
      question: "Does the exercise include at least one realistic complication the student must address (not a pure textbook case)?"
      required: true
    - id: clear_assumptions_student_verify
      question: "Does the exercise make clear what assumptions the student should verify before estimating?"
      required: true
  actionable:
    - id: provide_data_student_start
      question: "Does the exercise provide the data (or code to generate it) so the student can start immediately?"
      required: true
    - id: clearly_state_deliverable
      question: "Does the exercise clearly state what the deliverable is (estimate, plot, interpretation)?"
      required: true
