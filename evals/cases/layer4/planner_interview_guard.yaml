name: planner_interview_guard
description: Interview-regression guard — planner must lead with a preliminary recommendation, then ask one refining question at a time
layer: 4
skill: causal-planner
response_contract: first_turn
input_mode: inline
references:
  - references/decision-tree.md
  - references/method-registry.md
  - references/lessons.md
user_message: |
  We rolled out a new referral bonus to our regional offices at different times
  over the past year, and we have monthly signups for all offices going back
  three years. Did the bonus increase signups? I use R.
rubric:
  pedagogy:
    - "Does the response state a preliminary method recommendation (e.g., staggered DiD / event study) immediately, before asking any follow-up question — per the planner's 'always lead with a recommendation' rule, since staggered timing plus a multi-year panel already identifies a method family?"
  safety:
    - "Does it avoid committing to a final design without first learning whether some offices never received the bonus (a clean control group)?"
  actionable:
    - "Does it ask exactly one follow-up question in this turn (e.g., about never-treated offices or exact rollout timing), rather than a bulk list of every remaining question?"
