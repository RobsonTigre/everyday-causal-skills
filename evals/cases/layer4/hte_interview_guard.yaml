name: hte_interview_guard
description: Interview-regression guard — HTE skill must not skip any of its always-ask questions
layer: 4
skill: causal-hte
response_contract: first_turn
input_mode: inline
references:
  - references/assumptions/hte.md
  - references/method-registry.md
user_message: |
  I want to explore heterogeneous treatment effects in my program evaluation
  data. I have 4,000 users and covariates: age, income, region, tenure. I use
  Python.
rubric:
  pedagogy:
    - id: ask_variables_might_effect
      question: "Does it ask which variables might be effect modifiers, rather than assuming which covariates belong in X?"
      required: true
  safety:
    - id: ask_treatment_randomized_observational
      question: "Does it ask whether treatment is randomized or observational before proceeding?"
      required: true
    - id: ask_outcome_continuous_binary
      question: "Does it ask whether the outcome is continuous or binary?"
      required: true
  actionable:
    - id: ask_has_pre_specified
      question: "Does it ask whether the user has pre-specified subgroup hypotheses or is exploring?"
      required: true
