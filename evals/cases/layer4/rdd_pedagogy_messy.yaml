name: rdd_pedagogy_messy
description: RDD where manipulation is possible — skill must navigate the threat
layer: 4
skill: causal-rdd
response_contract: first_turn
references:
  - references/assumptions/rdd.md
  - references/method-registry.md
  - references/lessons.md
dataset: evals/data/rdd_bunching.csv
dataset_contract:
  columns: [student_id, test_score, scholarship, gpa]
  n_rows: 2000
user_message: |
  Students scoring >= 70 on an entrance exam get a scholarship. I want to estimate
  the effect of the scholarship on GPA. I have data on 2,000 students. I suspect
  some students might manipulate their exam score to qualify — there could be
  retakes or grading discretion near the cutoff. I use Python. In your first
  response, diagnose this threat and give me the immediate test and decision rule
  before moving to the main RDD estimate.
rubric:
  pedagogy:
    - id: explain_manipulation_invalidates_rdd
      question: "Does the response explain WHY manipulation invalidates RDD (it breaks the comparable-near-cutoff assumption)?"
      required: true
    - id: explain_density_test_looks
      question: "Does the response explain what the density test (rddensity) looks for and how to interpret it?"
      required: true
    - id: first_surface_donut_hole
      question: "Does the first response surface a donut-hole test immediately, explaining that excluding a narrow manipulated band may address localized heaping but cannot salvage broader sorting around the cutoff?"
      required: true
  safety:
    - id: take_manipulation_concern_seriously
      question: "Does the response take the manipulation concern seriously rather than dismissing it?"
      required: true
    - id: communicate_rdd_may_be_unsalvageable
      question: "Does the response communicate that if manipulation is severe, RDD may not be salvageable?"
      required: true
  actionable:
    - id: first_provide_code_density
      question: "Does the first response provide code for the density test and donut-hole sensitivity before any main RDD estimation?"
      required: true
    - id: provide_conditional_guidance
      question: "Does the response provide conditional guidance: 'if test passes, proceed with X; if not, consider Y'?"
      required: true
