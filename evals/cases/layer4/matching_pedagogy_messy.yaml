name: matching_pedagogy_messy
description: Matching with poor overlap — skill must handle practically
layer: 4
skill: causal-matching
response_contract: first_turn
references:
  - references/assumptions/matching.md
  - references/method-registry.md
  - references/lessons.md
dataset: evals/data/matching_poor_overlap.csv
dataset_contract:
  columns: [id, age, tenure, department, treated, productivity]
  n_rows: 500
user_message: |
  I'm comparing productivity for employees who voluntarily enrolled in a wellness
  program vs those who didn't. I have age, tenure, and department as covariates.
  The enrollees look quite different from non-enrollees on these covariates, and
  the propensity score distributions barely overlap. I have 500 employees total.
  I use Python.
rubric:
  pedagogy:
    - id: explain_poor_overlap_means
      question: "Does the response explain what poor overlap means for causal inference (extrapolation, model dependence)?"
      required: true
    - id: explain_trimming_truncation_bias
      question: "Does the response explain trimming/truncation and the bias-variance trade-off it creates?"
      required: true
    - id: explain_voluntary_enrollment_selection
      question: "Does the response explain that voluntary enrollment creates strong selection bias that covariates may not fully capture?"
      required: true
  safety:
    - id: honestly_assess_matching_produce
      question: "Does the response honestly assess whether matching can produce reliable estimates given the overlap issue?"
      required: true
    - id: discuss_fundamental_problem_voluntary
      question: "Does the response discuss the fundamental problem — voluntary enrollment is driven by unobservable motivation?"
      required: true
  actionable:
    - id: provide_code_visualizes_overlap
      question: "Does the response provide code that visualizes the overlap problem before attempting to estimate?"
      required: true
    - id: suggest_alternatives_if_matching_unviable
      question: "Does the response suggest practical alternatives if matching is not viable (bounds, sensitivity analysis, IV if instrument available)?"
      required: true
