name: dag_pedagogy_clean
description: DAG skill provides clear pedagogy for a straightforward confounder case
layer: 4
skill: causal-dag
response_contract: first_turn
input_mode: inline
references:
  - references/assumptions/dag.md
  - references/method-registry.md
  - references/lessons.md
user_message: |
  I'm studying the effect of exercise on blood pressure. I think age affects both
  exercise frequency and blood pressure. Help me draw the DAG and figure out what
  to control for. I use R.
rubric:
  pedagogy:
    - id: explain_age_confounder
      question: "Does the skill explain WHY age is a confounder (not just label it)?"
      required: true
    - id: explain_backdoor_path_concept
      question: "Does it explain the backdoor path concept in accessible language?"
      required: true
  safety:
    - id: warn_dag_encodes_assumptions
      question: "Does it warn that the DAG encodes assumptions, not facts, and unobserved confounders could change the conclusion?"
      required: true
  actionable:
    - id: explanation_tailored_to_context
      question: "Is the explanation tailored to the user's specific context (exercise/BP, not generic)?"
      required: true
    - id: recommend_next_step
      question: "Does it recommend a next step (method skill)?"
      required: true
deferred_rubric:
  - "Does it justify the adjustment set (not just list it)? (only reachable once the DAG interview has moved past turn one)"
