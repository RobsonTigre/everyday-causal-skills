name: planner_pedagogy_clear
description: Planner explains method choice clearly and produces actionable plan
layer: 4
skill: causal-planner
response_contract: first_turn
input_mode: inline
references:
  - references/decision-tree.md
  - references/method-registry.md
  - references/lessons.md
user_message: |
  We launched a loyalty program in 10 of our 200 retail stores 6 months ago.
  We have weekly sales data for all stores going back 2 years. We want to know
  if the loyalty program increased sales. I use R.
rubric:
  pedagogy:
    - id: explain_recommended_method_fits
      question: "Does the response explain WHY the recommended method fits this specific scenario, not just name it?"
      required: true
    - id: explain_assumptions_need_verify
      question: "Does the response explain what assumptions the user will need to verify and why each matters?"
      required: true
    - id: multiple_methods_apply_explain
      question: "If multiple methods could apply, does the response explain the trade-offs between them?"
      required: true
  safety:
    - id: warn_potential_pitfalls_specific
      question: "Does the response warn about potential pitfalls specific to this setup (e.g., spillover between stores, selection of the 10 stores)?"
      required: true
    - id: avoid_overpromising_reliability_estimate
      question: "Does the response avoid overpromising the reliability of the estimate?"
      required: true
  actionable:
    - id: produce_structured_plan_clear
      question: "Does the response produce a structured plan or clear next steps the user can follow?"
      required: true
    - id: name_provisional_skill_and_prep
      question: "Does the first-turn response name the provisional /causal-did skill and specify the required long-panel preparation: store and week identifiers, outcome, treatment timing/cohort, and never-treated or not-yet-treated comparison indicators?"
      required: true
