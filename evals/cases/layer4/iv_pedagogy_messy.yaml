name: iv_pedagogy_messy
description: IV with borderline instrument strength — skill must navigate honestly
layer: 4
skill: causal-iv
response_contract: first_turn
references:
  - references/assumptions/iv.md
  - references/method-registry.md
  - references/lessons.md
dataset: evals/data/iv_weak.csv
dataset_contract:
  columns: [id, distance, education, earnings]
  n_rows: 1000
user_message: |
  I'm trying to estimate the effect of years of education on earnings. My instrument
  is distance from each student's home to the nearest college. I have data on 1,000
  students. The first-stage relationship looks "okay but not amazing." I use R.
rubric:
  pedagogy:
    - id: explain_weak_instrument_bias
      question: "Does the response explain weak instrument bias and why it makes 2SLS unreliable?"
      required: true
    - id: explain_stock_yogo_critical_values
      question: "Does the response explain what the Stock-Yogo critical values mean and how to interpret them?"
      required: true
    - id: explain_weak_iv_bias_toward_ols
      question: "Does the response explain that weak IV bias is toward OLS, not toward zero?"
      required: true
  safety:
    - id: honestly_assess_instrument_strong
      question: "Does the response honestly assess whether this instrument is strong enough to proceed?"
      required: true
    - id: suggest_alternatives_instrument_too
      question: "Does the response suggest alternatives if the instrument is too weak (reduced form, bounds, different instrument)?"
      required: true
  actionable:
    - id: provide_code_reports_diagnostics
      question: "Does the response provide code that reports the diagnostics needed to make the strength judgment?"
      required: true
    - id: include_anderson_rubin_confidence
      question: "Does the response include Anderson-Rubin confidence intervals or other weak-instrument-robust methods?"
      required: true
