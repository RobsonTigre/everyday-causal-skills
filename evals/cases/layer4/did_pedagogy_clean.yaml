name: did_pedagogy_clean
description: DiD skill with clean data — must explain assumptions clearly and produce usable code
layer: 4
skill: causal-did
response_contract: final_output
references:
  - references/assumptions/did.md
  - references/method-registry.md
  - references/lessons.md
dataset: evals/data/did_clean.csv
user_message: |
  I have panel data for 100 stores over 24 months. Half got a new checkout system
  at month 12. I want to estimate the effect on sales using DiD. I use R.
  This is my first time running a DiD analysis. These are the final inputs. Give
  me the complete explanation, diagnostics, and runnable R analysis now; do not
  stop for an intake question.
rubric:
  pedagogy:
    - id: explain_parallel_trends_means
      question: "Does the response explain what parallel trends means in plain language, not just say 'check parallel trends'?"
      required: true
    - id: explain_what_att_does_and_does_not_capture
      question: "Does the response explain what the DiD estimate captures (the ATT) and what it does NOT capture?"
      required: true
    - id: walk_through_part_regression
      question: "Does the response walk through what each part of the regression specification means?"
      required: true
  safety:
    - id: mention_future_trends_untestable
      question: "Does the response mention that even with good pre-trends, DiD assumes future trends would have continued — and this is untestable?"
      required: true
    - id: warn_standard_error_clustering
      question: "Does the response warn about standard error clustering and why it matters for inference?"
      required: true
  actionable:
    - id: provide_complete_runnable_code
      question: "Does the response provide complete, runnable code (not pseudocode or fragments)?"
      required: true
    - id: include_diagnostic_code_alongside
      question: "Does the response include diagnostic code (event study plot, pre-trends test) alongside the main estimate?"
      required: true
