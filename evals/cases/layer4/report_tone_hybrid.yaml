name: report_tone_hybrid
description: Same analysis in hybrid mode — accessible with methodological rigor
layer: 4
skill: causal-report
response_contract: final_output
input_mode: inline
references:
  - references/method-registry.md
  - references/lessons.md
user_message: |
  We ran a DiD comparing 12 stores that got a loyalty program to 38 that didn't.
  The program increased repeat purchases by 12 percentage points (95% CI: 8-16 pp).
  The pre-trends joint test did not reject equal pre-treatment trends. No fatal
  audit findings. Write a hybrid report. That's everything I have — draft the
  full report now in one go, noting anything unavailable as such; don't ask me
  follow-up questions first.
rubric:
  pedagogy:
    - id: use_plain_language_formal
      question: "Does the report use plain language with formal names in parentheses?"
      required: true
    - id: include_summary_regression_table
      question: "Does it include a summary regression table but explain it in accessible terms?"
      required: true
    - id: readable_quantitatively_literate_non
      question: "Is it readable by a quantitatively literate non-specialist?"
      required: true
  safety:
    - id: include_meaningful_limitations
      question: "Does it include meaningful limitations, not just a token mention?"
      required: true
    - id: avoid_both_oversimplification_unnecessary
      question: "Does it avoid both oversimplification and unnecessary jargon?"
      required: true
  actionable:
    - id: balance_recommendations_caveats
      question: "Does it balance recommendations with caveats?"
      required: true
    - id: both_data_scientist_product
      question: "Could both a data scientist and a product manager read this?"
      required: true
