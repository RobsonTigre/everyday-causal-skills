name: dag_interview_guard
description: Interview-regression guard — DAG skill must ask one question at a time, not dump the remaining Stage-1 interview
layer: 4
skill: causal-dag
response_contract: first_turn
input_mode: inline
references:
  - references/assumptions/dag.md
  - references/method-registry.md
  - references/lessons.md
user_message: |
  I want to know if a new checkout page increased conversion rate. Help me build
  the DAG.
rubric:
  pedagogy:
    - "Does the response recognize that treatment (new checkout page) and outcome (conversion rate) are already given, rather than re-asking for them?"
  safety:
    - "Does it avoid inventing or assuming confounders on the user's behalf instead of asking about them?"
  actionable:
    - "Does it ask exactly one next decision-relevant question (e.g., what determines who sees the new page, or what else affects conversion), rather than dumping the remaining Stage-1 questions as a bulk list or form?"
