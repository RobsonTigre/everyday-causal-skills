name: timeseries_pedagogy_messy
description: Timeseries with structural break in pre-period — skill must flag and navigate
layer: 4
skill: causal-timeseries
response_contract: first_turn
references:
  - references/assumptions/timeseries.md
  - references/method-registry.md
  - references/lessons.md
dataset: evals/data/timeseries_structural_break.csv
user_message: |
  A new regulation took effect at month 37 out of 60 months of data. I want to
  estimate its effect using ITS. Looking at the data, there seems to be an unusual
  shift around month 15-20 in the pre-period — we changed our data collection
  methodology at that time. I use R.
rubric:
  pedagogy:
    - id: explain_pre_period_structural
      question: "Does the response explain WHY a pre-period structural break invalidates the counterfactual projection?"
      required: true
    - id: explain_tests_detect_structural
      question: "Does the response explain what tests can detect structural breaks (Chow, CUSUM) and how to interpret them?"
      required: true
    - id: explain_options_truncate_pre
      question: "Does the response explain the options: truncate pre-period, model the break, or acknowledge the limitation?"
      required: true
  safety:
    - id: clearly_state_proceeding_without
      question: "Does the response clearly state that proceeding without addressing the break produces unreliable estimates?"
      required: true
    - id: avoid_presenting_break_minor
      question: "Does the response avoid presenting the break as a minor nuisance that can be ignored?"
      required: true
  actionable:
    - id: provide_code_test_visualize
      question: "Does the response provide code to test for and visualize the structural break?"
      required: true
    - id: suggest_concrete_path_forward
      question: "Does the response suggest a concrete path forward (e.g., use only post-break pre-period, add a level shift dummy)?"
      required: true
