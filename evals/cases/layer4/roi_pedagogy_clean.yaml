name: roi_pedagogy_clean
description: Clean ROI translation — explains incremental-vs-anyway plainly, presents a range, keeps assumptions visible
layer: 4
skill: causal-roi
response_contract: final_output
references:
  - references/roi-framework.md
  - references/lessons.md
user_message: |
  Our loyalty-program experiment measured +R$3.10 incremental profit per member per
  month (95% CI [2.20, 4.00]), ATE, randomized across all 800k members. Finance
  gave me everything: 12-month horizon, monthly discount rate 1%, holdout-estimated
  persistence 0.92, member survival 0.98/month, full rollout at launch to the same
  members, transport 1.0, cannibalization assessed at 5% (net incrementality 0.95),
  investment R$6M one-time plus R$150k/month. Hurdle confirmed at breakeven, 2x
  buffer. Use R for the calculation. Everything above is final — please don't
  ask me follow-up questions or wait for confirmation. Walk me through what this
  is worth and whether we ship, end to end, right now — I'm presenting to a
  non-technical exec team.

  I ran the canonical R script with exactly those inputs and am supplying its
  complete raw KEY output for you to verify and use:
  EFFECTIVE_PERIODS: 6.9317167158
  PV_INCREMENTAL_PROFIT_PER_UNIT: 21.4883218191
  PV_INCREMENTAL_PROFIT: 16331124.5825
  NET_PROFIT: 8625980.3453
  ROI: 1.1195092629
  ROI_LO: 0.5041678640
  ROI_HI: 1.7348506618
  BREAKEVEN_EFFECT: 1.4626027139
  VERDICT_CODE: 1
rubric:
  pedagogy:
    - "Does the response explain 'incremental' plainly — value caused by the program, above what would have happened anyway?"
    - "Does it explain WHY the naive effect-times-members-times-12 number overstates (decay, churn, discounting, cannibalization) rather than just applying discounts silently?"
    - "Is the breakeven concept explained in plain terms (the smallest effect that pays back the investment)?"
  safety:
    - "Is ROI reported from the supplied raw output as 1.1195092629 with interval [0.5041678640, 1.7348506618], not recomputed or invented?"
    - "Are the pipeline assumptions (decay rate, no cannibalization beyond the assessed 5%, stable costs, valid upstream estimate) surfaced rather than hidden?"
    - "Does it avoid overstating — no guarantees, forecast framed as a projection with a scheduled check against actuals?"
  actionable:
    - "Does it report breakeven 1.4626027139 and VERDICT_CODE 1 as a staged ship because the lower effect bound clears breakeven but not the 2x buffer?"
    - "Does it recommend concrete post-launch validation (e.g., holdout to re-estimate decay, compare forecast vs actuals)?"
