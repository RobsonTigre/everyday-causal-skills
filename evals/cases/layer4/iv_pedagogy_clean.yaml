name: iv_pedagogy_clean
description: IV skill with strong instrument — must explain LATE and diagnostics clearly
layer: 4
skill: causal-iv
response_contract: final_output
references:
  - references/assumptions/iv.md
  - references/method-registry.md
  - references/lessons.md
dataset: evals/data/iv_strong.csv
dataset_contract:
  columns: [id, draft_number, served, earnings]
  n_rows: 1000
user_message: |
  I'm studying a historical draft lottery — a random draft number determined who
  was called up, but not everyone drafted actually served, and some who weren't
  drafted volunteered anyway. I want to estimate the effect of military service on
  later earnings. The draft number is my instrument. I have data on 1,000 men.
  I use Python. This is my first IV analysis. These are the final inputs. Give me
  the complete explanation, diagnostics, and runnable Python analysis now; do not
  stop for an intake question.
rubric:
  pedagogy:
    - id: explain_late_means_compliers
      question: "Does the response explain what LATE means and who the 'compliers' are in this context?"
      required: true
    - id: explain_itt_versus_late
      question: "Does the response explain the difference between ITT and LATE and when each is useful?"
      required: true
    - id: explain_first_stage_statistic
      question: "Does the response explain what the first-stage F-statistic tells you and what values indicate problems?"
      required: true
  safety:
    - id: explain_exclusion_restriction_untestable
      question: "Does the response explain that the exclusion restriction is untestable and requires a substantive argument?"
      required: true
    - id: mention_late_differ_ate
      question: "Does the response mention that LATE may differ from ATE and explain why this matters for decision-making?"
      required: true
  actionable:
    - id: provide_complete_2sls_code
      question: "Does the response provide complete 2SLS code with first-stage diagnostics?"
      required: true
    - id: include_reduced_form_first
      question: "Does the response include reduced-form and first-stage results alongside the IV estimate?"
      required: true
