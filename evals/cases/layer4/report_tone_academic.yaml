name: report_tone_academic
description: Same analysis in academic mode — formal notation, full tables
layer: 4
skill: causal-report
response_contract: final_output
input_mode: inline
references:
  - references/method-registry.md
  - references/lessons.md
user_message: |
  We ran a DiD comparing 12 stores that got a loyalty program to 38 that didn't.
  The program increased repeat purchases by 12 percentage points (95% CI: 8-16 pp).
  The pre-trends joint test did not reject equal pre-treatment trends. No fatal
  audit findings. Write an academic report for a working paper. That's
  everything I have — draft the full report now in one go, noting anything
  unavailable as such; don't ask me follow-up questions first.
rubric:
  pedagogy:
    - id: include_formal_estimand_notation
      question: "Does the report include formal estimand notation (ATT)?"
      required: true
    - id: describe_identification_strategy_precisely
      question: "Does it describe the identification strategy precisely?"
      required: true
    - id: include_supplied_results_table
      question: "Does it include a supplied-results table with the 12 pp estimate and 95% CI, with the standard error, sample size, R-squared, and additional specification rows marked as unavailable rather than fabricating them?"
      required: true
  safety:
    - id: discuss_threats_internal_external
      question: "Does it discuss threats to internal and external validity systematically?"
      required: true
    - id: acknowledge_small_number_treated
      question: "Does it acknowledge the small number of treated units?"
      required: true
    - id: fill_nine_sections_without_inventing
      question: "Does it fill all nine report sections in this one response without inventing unavailable diagnostics, estimates, or artifacts?"
      required: true
  actionable:
    - id: appendix_state_honestly_full
      question: "Does the appendix state honestly that full estimation code is unavailable and request the exact missing code/data needed to reproduce the model?"
      required: true
    - id: reference_parallel_trends_assumption
      question: "Does it reference the parallel trends assumption formally?"
      required: true
