name: planner_pedagogy_ambiguous
description: Ambiguous scenario — planner must navigate uncertainty and explain trade-offs
layer: 4
skill: causal-planner
response_contract: first_turn
input_mode: inline
references:
  - references/decision-tree.md
  - references/method-registry.md
  - references/lessons.md
user_message: |
  A ride-sharing company changed its surge pricing algorithm in one city. They have
  data on rides, prices, and driver supply for 50 cities over 18 months. The change
  happened 6 months ago. They also have a "driver score" threshold — drivers above
  score 80 were eligible to opt into the new algorithm early. About 30% of eligible
  drivers opted in. I use Python. What's the best way to estimate the effect on
  driver earnings?
rubric:
  pedagogy:
    - id: identify_multiple_causal_strategies
      question: "Does the response identify that multiple causal strategies are possible here (DiD across cities, RDD on driver score, IV on opt-in)?"
      required: true
    - id: explain_strengths_limitations_viable
      question: "Does the response explain the strengths and limitations of each viable approach?"
      required: true
    - id: help_understand_assumptions_hardest
      question: "Does the response help the user understand which assumptions are hardest to defend for each option?"
      required: true
  safety:
    - id: flag_opt_endogenous_naive
      question: "Does the response flag that opt-in is endogenous and naive opt-in vs non-opt-in comparison is biased?"
      required: true
    - id: primary_recommendation_conditional_unresolved
      question: "Does the response make its primary recommendation conditional on the unresolved design fact while acknowledging the viable alternatives?"
      required: true
  actionable:
    - id: give_conditional_primary_recommendation
      question: "Does the response give a conditional primary recommendation and name the hardest identifying assumption for that recommendation?"
      required: true
    - id: identify_first_discriminating_data
      question: "Does the response identify the first discriminating data check that would decide among the candidate methods (rather than offering a generic checklist)?"
      required: true
