  window. Same kiosks, same period — transport and net incrementality are both 1.0.
  Investment: R$200,000 one-time, no recurring costs. Hurdle: breakeven (ROI ≥ 0),
  confirmed; use a 2x margin-of-safety buffer. Give me ONE complete R script in a single
  code block that prints the machine-readable KEY: value lines, and state the verdict.
