user_message: |
  Everything is specified — no interview needed, just build and run the calculation in R
  (base R only). Our kiosk pilot measured +R$2,000 incremental PROFIT per kiosk per month
  (already net of all variable costs), 95% CI [R$1,000, R$3,000]. It's an ATE from a
  randomized rollout on the same 100 kiosks we'll keep running. Horizon: 3 months, constant
